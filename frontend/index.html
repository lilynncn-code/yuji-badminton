<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        var host = window.location && window.location.hostname
        var isLocal = host === 'localhost' || host === '127.0.0.1' || host === ''
        if (!isLocal) {
          return
        }

        var error = console.error.bind(console)
        var warn = console.warn.bind(console)
        var hiddenTexts = [
          'legacy JS API is deprecated',
          "importing from 'vue-router/dist/vue-router.esm-bundler.js' is deprecated",
          'Map key not configured.',
          'Map load failed.'
        ]

        function shouldHide(args) {
          if (!args.length) {
            return true
          }
          if (args.length === 1 && args[0] && typeof args[0] === 'object' && !args[0].message && !args[0].stack) {
            return true
          }
          var text = args.map(function (item) {
            return typeof item === 'string' ? item : item && item.message ? item.message : ''
          }).join(' ')
          return hiddenTexts.some(function (item) {
            return text.indexOf(item) !== -1
          })
        }

        function isEmptyObjectError(value) {
          return value && typeof value === 'object' && !value.message && !value.stack
        }

        console.error = function () {
          var args = Array.prototype.slice.call(arguments)
          if (!shouldHide(args)) {
            error.apply(console, args)
          }
        }

        console.warn = function () {
          var args = Array.prototype.slice.call(arguments)
          if (!shouldHide(args)) {
            warn.apply(console, args)
          }
        }

        window.addEventListener('unhandledrejection', function (event) {
          if (isEmptyObjectError(event.reason)) {
            event.preventDefault()
          }
        })

        window.addEventListener('error', function (event) {
          if (isEmptyObjectError(event.error)) {
            event.preventDefault()
          }
        })
      })()

      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title></title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
